<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Bonch Go — ИКТО-2542</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-base: #0B0D11;
            --bg-card: #151922;
            --bg-card-subtle: #1B202D;
            --bg-card-green: rgba(16, 185, 129, 0.08);
            --border-subtle: rgba(255, 255, 255, 0.07);
            
            --orange: #FF6B2B;
            --orange-soft: rgba(255, 107, 43, 0.15);
            --orange-glow: rgba(255, 107, 43, 0.35);

            --blue: #3B82F6;
            --blue-badge-bg: rgba(59, 130, 246, 0.18);
            
            --green: #10B981;
            --green-badge-bg: rgba(16, 185, 129, 0.18);

            --yellow: #F59E0B;
            --yellow-badge-bg: rgba(245, 158, 11, 0.18);

            --red: #EF4444;
            --red-badge-bg: rgba(239, 68, 68, 0.18);

            --text-white: #FFFFFF;
            --text-secondary: #9CA3AF;
            --text-muted: #6B7280;
            --text-dark: #4B5563;

            --radius-lg: 18px;
            --radius-md: 14px;
            --radius-pill: 9999px;

            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-base);
            color: var(--text-white);
            overflow-x: hidden;
            padding-bottom: calc(75px + var(--safe-bottom));
            min-height: 100vh;
        }

        /* Top Bar */
        .status-pill-bar {
            display: flex;
            justify-content: center;
            padding-top: 10px;
            padding-bottom: 4px;
        }

        .bonch-go-badge {
            background: #FFFFFF;
            color: #000000;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 14px;
            border-radius: var(--radius-pill);
            letter-spacing: -0.2px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .bonch-go-badge span {
            color: var(--orange);
        }

        /* Header */
        .header {
            padding: 12px 18px 8px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-white);
        }

        .header-icons {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-icon-btn {
            background: none;
            border: none;
            color: var(--orange);
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s;
        }

        .header-icon-btn:active {
            transform: scale(0.9);
        }

        .header-date-range {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 2px;
        }

        /* View Mode Segmented Control (День, Неделя, Список) */
        .view-segmented {
            display: flex;
            background: #141720;
            border-radius: 12px;
            padding: 3px;
            margin: 12px 18px 14px;
            border: 1px solid var(--border-subtle);
        }

        .segmented-btn {
            flex: 1;
            padding: 8px 0;
            text-align: center;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .segmented-btn.active {
            background: #252A38;
            color: var(--text-white);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        /* Calendar Strip (Days of week) */
        .calendar-strip-container {
            display: flex;
            align-items: center;
            padding: 0 10px;
            margin-bottom: 14px;
        }

        .strip-arrow {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            padding: 8px 4px;
            cursor: pointer;
        }

        .calendar-strip {
            display: flex;
            gap: 6px;
            flex: 1;
            overflow-x: auto;
            scrollbar-width: none;
            justify-content: space-between;
        }

        .calendar-strip::-webkit-scrollbar {
            display: none;
        }

        .day-pill {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 8px;
            border-radius: 14px;
            border: 1px solid var(--border-subtle);
            background: #131722;
            color: var(--text-secondary);
            cursor: pointer;
            min-width: 46px;
            flex: 1;
            transition: all 0.2s;
        }

        .day-pill .dp-dow {
            font-size: 12px;
            font-weight: 700;
        }

        .day-pill .dp-date {
            font-size: 10px;
            font-weight: 600;
            margin-top: 2px;
            opacity: 0.8;
        }

        /* Stripes under day indicating classes */
        .dp-stripes {
            display: flex;
            gap: 2px;
            margin-top: 6px;
            height: 3px;
            width: 16px;
            border-radius: 2px;
            justify-content: center;
        }

        .dp-stripe {
            width: 4px;
            height: 3px;
            border-radius: 1px;
            background: var(--blue);
        }

        .dp-stripe.green { background: var(--green); }
        .dp-stripe.orange { background: var(--orange); }
        .dp-stripe.yellow { background: var(--yellow); }

        .day-pill.active {
            background: var(--orange) !important;
            border-color: var(--orange) !important;
            color: #FFFFFF !important;
            box-shadow: 0 4px 14px var(--orange-glow);
        }

        .day-pill.active .dp-stripe {
            background: #FFFFFF !important;
        }

        /* Summary bar (≡ Лекций 2 · Практик 1) */
        .summary-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 18px 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 16px;
        }

        .summary-bar .icon {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* ==================== PAGES ==================== */
        .page {
            display: none;
            padding: 0 18px;
            animation: fadeIn 0.2s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ==================== TIMELINE LESSONS ==================== */
        .timeline-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .timeline-row {
            display: flex;
            gap: 12px;
            position: relative;
        }

        /* Left side timeline */
        .timeline-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 44px;
            flex-shrink: 0;
            padding-top: 2px;
        }

        .time-badge {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
            color: #FFFFFF;
        }

        .time-badge.blue { background: #3B82F6; }
        .time-badge.green { background: #10B981; }
        .time-badge.orange { background: #F97316; }
        .time-badge.yellow { background: #EAB308; }

        .time-start {
            font-size: 12px;
            font-weight: 700;
            color: #FFFFFF;
            margin-top: 5px;
            letter-spacing: -0.2px;
        }

        .time-line {
            width: 2px;
            flex: 1;
            min-height: 48px;
            margin: 6px 0;
            border-radius: 1px;
            opacity: 0.6;
        }

        .time-line.blue { background: #3B82F6; }
        .time-line.green { background: #10B981; }
        .time-line.orange { background: #F97316; }
        .time-line.yellow { background: #EAB308; }

        .time-end {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        /* Right side card */
        .lesson-card-bonch {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 14px 16px;
            margin-bottom: 12px;
            position: relative;
            transition: transform 0.15s, border-color 0.15s;
        }

        .lesson-card-bonch:active {
            transform: scale(0.99);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .lesson-card-bonch.pe {
            background: #111B17;
            border-color: rgba(16, 185, 129, 0.15);
        }

        .card-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .type-pill {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: var(--radius-pill);
            letter-spacing: 0.2px;
        }

        .type-pill.blue {
            background: var(--blue-badge-bg);
            color: #60A5FA;
        }

        .type-pill.green {
            background: var(--green-badge-bg);
            color: #34D399;
        }

        .type-pill.yellow {
            background: var(--yellow-badge-bg);
            color: #FBBF24;
        }

        .type-pill.orange {
            background: var(--orange-soft);
            color: var(--orange);
        }

        .card-counter {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-white);
            line-height: 1.35;
            margin-bottom: 8px;
        }

        .card-info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        .card-info-item {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-arrow {
            color: var(--text-dark);
            font-size: 13px;
            font-weight: 700;
        }

        /* Floating Today Button */
        .fab-today {
            position: fixed;
            bottom: calc(85px + var(--safe-bottom));
            right: 18px;
            background: var(--orange);
            color: #FFFFFF;
            padding: 12px 20px;
            border-radius: var(--radius-pill);
            font-size: 14px;
            font-weight: 800;
            border: none;
            box-shadow: 0 6px 20px var(--orange-glow);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            z-index: 90;
            transition: transform 0.15s;
            font-family: inherit;
        }

        .fab-today:active {
            transform: scale(0.94);
        }

        /* ==================== SESSION / DEBTS STYLES ==================== */
        .session-banner {
            background: linear-gradient(135deg, #1E120A, #2C180B);
            border: 1px solid rgba(255, 107, 43, 0.25);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 16px;
        }

        .sb-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--orange);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sb-dates {
            font-size: 13px;
            color: #FFFFFF;
            font-weight: 600;
            margin-top: 4px;
        }

        .sb-info {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .debt-item-bonch {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s;
        }

        .debt-item-bonch.passed {
            opacity: 0.5;
            border-color: rgba(16, 185, 129, 0.2);
        }

        .debt-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .debt-name {
            font-size: 15px;
            font-weight: 700;
            color: #FFFFFF;
            line-height: 1.3;
        }

        .debt-status-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            white-space: nowrap;
        }

        .debt-status-tag.urgent {
            background: var(--red-badge-bg);
            color: #F87171;
        }

        .debt-status-tag.soon {
            background: var(--orange-soft);
            color: var(--orange);
        }

        .debt-status-tag.done {
            background: var(--green-badge-bg);
            color: #34D399;
        }

        .debt-meta {
            margin-top: 10px;
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .debt-meta-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 3px;
        }

        .dates-box {
            background: #0F1219;
            border-radius: 10px;
            padding: 10px 12px;
            margin-top: 10px;
            font-size: 11px;
            line-height: 1.7;
            border: 1px solid var(--border-subtle);
        }

        .pdf-link {
            color: var(--orange);
            text-decoration: none;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
        }

        .debt-actions-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .btn-bonch {
            padding: 8px 14px;
            border-radius: 10px;
            border: none;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
        }

        .btn-bonch.success {
            background: var(--green);
            color: #FFFFFF;
        }

        .btn-bonch.outline {
            background: #1E2330;
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
        }

        /* ==================== BOTTOM NAV ==================== */
        .bottom-nav-bonch {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #10131B;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 calc(8px + var(--safe-bottom));
            z-index: 100;
        }

        .nav-tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 4px 14px;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.2s;
        }

        .nav-tab-btn .nav-icon {
            font-size: 20px;
        }

        .nav-tab-btn.active {
            color: var(--orange);
        }

        .nav-tab-btn.active .nav-icon {
            transform: scale(1.1);
        }

        .nav-pill-active {
            background: #251B13;
            border-radius: var(--radius-pill);
            padding: 4px 16px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            display: none;
            align-items: flex-end;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.show { display: flex; }

        .modal {
            background: #151922;
            border-radius: 24px 24px 0 0;
            padding: 24px 20px calc(24px + var(--safe-bottom));
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            border-top: 1px solid var(--border-subtle);
        }

        .modal-handle {
            width: 38px;
            height: 4px;
            border-radius: 2px;
            background: var(--text-dark);
            margin: 0 auto 18px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 16px;
            color: #FFFFFF;
        }

        .form-group { margin-bottom: 14px; }
        .form-label { font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; display: block; }
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 12px 14px;
            background: #0E1118;
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            font-size: 14px;
            color: #FFFFFF;
            outline: none;
            font-family: inherit;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            border-color: var(--orange);
        }
        .form-btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--orange);
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 6px;
        }

        .empty-box {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }
        .empty-box .icon { font-size: 42px; margin-bottom: 8px; }
    </style>
</head>
<body>

    <!-- Dynamic Island / Header Logo -->
    <div class="status-pill-bar">
        <div class="bonch-go-badge">
            Bonch <span>Go</span>
        </div>
    </div>

    <!-- Main Header -->
    <div class="header">
        <div class="header-top">
            <div class="header-title">ИКТО-2542</div>
            <div class="header-icons">
                <button class="header-icon-btn" onclick="switchTab('session')" title="Сессия">🎓</button>
                <button class="header-icon-btn" onclick="switchTab('homework')" title="ДЗ">📋</button>
                <button class="header-icon-btn" onclick="resetCache()" title="Сброс кэша">🔄</button>
            </div>
        </div>
        <div class="header-date-range" id="header-date-range">23 ноября – 28 ноября</div>
    </div>

    <!-- Segmented Control: День | Неделя | Список -->
    <div class="view-segmented">
        <button class="segmented-btn active" onclick="setViewMode('day', this)">День</button>
        <button class="segmented-btn" onclick="toggleWeekType(this)" id="btn-week-toggle">Нечётная</button>
        <button class="segmented-btn" onclick="setViewMode('list', this)">Список</button>
    </div>

    <!-- Calendar Day Strip -->
    <div class="calendar-strip-container" id="calendar-strip-wrap">
        <button class="strip-arrow" onclick="navDay(-1)">❮</button>
        <div class="calendar-strip" id="calendar-strip"></div>
        <button class="strip-arrow" onclick="navDay(1)">❯</button>
    </div>

    <!-- Summary Bar (≡ Лекций 2 · Практик 1) -->
    <div class="summary-bar" id="summary-bar">
        <span class="icon">≡</span>
        <span id="summary-text">Загрузка занятий...</span>
    </div>

    <!-- ===== PAGE: SCHEDULE (TIMELINE) ===== -->
    <div class="page active" id="page-schedule">
        <div class="timeline-container" id="timeline-list"></div>
    </div>

    <!-- ===== PAGE: SESSION / DEBTS ===== -->
    <div class="page" id="page-session">
        <div class="session-banner">
            <div class="sb-title">🏛 Вторая повторная аттестация</div>
            <div class="sb-dates">📆 10 — 30 ноября 2026 (комиссии)</div>
            <div class="sb-info">Официальные расписания с сайта СПбГУТ (sut.ru/studentu/raspisanie)</div>
        </div>
        <div id="debts-container"></div>
        <button class="btn-bonch outline" style="width: 100%; padding: 12px; margin-top: 10px;" onclick="openAddDebtModal()">➕ Добавить предмет</button>
    </div>

    <!-- ===== PAGE: HOMEWORK ===== -->
    <div class="page" id="page-homework">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
            <div style="font-size: 18px; font-weight: 800;">Домашние задания</div>
            <button class="btn-bonch success" onclick="openAddHWModal()">+ Новое ДЗ</button>
        </div>
        <div id="hw-container"></div>
    </div>

    <!-- ===== PAGE: RETAKES ===== -->
    <div class="page" id="page-retakes">
        <div style="font-size: 18px; font-weight: 800; margin-bottom: 14px;">Календарь пересдач</div>
        <div id="retakes-container"></div>
    </div>

    <!-- Floating Today Button -->
    <button class="fab-today" id="fab-today" onclick="goToToday()">
        <span>📅</span> Сегодня
    </button>

    <!-- Bottom Navigation Bar (Bonch Go Style) -->
    <div class="bottom-nav-bonch">
        <button class="nav-tab-btn active" onclick="switchTab('schedule')" data-tab="schedule">
            <span class="nav-icon">📅</span>
            <span>Пары</span>
        </button>
        <button class="nav-tab-btn" onclick="switchTab('session')" data-tab="session">
            <span class="nav-icon">🎓</span>
            <span>Сессия</span>
        </button>
        <button class="nav-tab-btn" onclick="switchTab('homework')" data-tab="homework">
            <span class="nav-icon">📝</span>
            <span>ДЗ</span>
        </button>
        <button class="nav-tab-btn" onclick="switchTab('retakes')" data-tab="retakes">
            <span class="nav-icon">🔄</span>
            <span>Даты</span>
        </button>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-handle"></div>
            <div id="modal-content"></div>
        </div>
    </div>

<script>
// ==================== REAL DATA: ИКТО-2542, СПбГУТ ====================

// ==================== STATE ====================
let currentTab = 'schedule';
let selectedDow = new Date().getDay(); // 0=Sun..6=Sat
if (selectedDow === 0) selectedDow = 1;
let currentWeekType = getAutoWeekType();
let weekOffset = 0; // 0 = current week, +1 next, -1 prev

function getAutoWeekType() {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 1);
    const diff = (now - start + ((start.getTimezoneOffset() - now.getTimezoneOffset()) * 60000)) / 864e5;
    const weekNum = Math.ceil((diff + start.getDay() + 1) / 7);
    return (weekNum % 2 === 1) ? 1 : 2;
}

function getDebts() {
    const s = localStorage.getItem('bonch_debts_v4');
    return s ? JSON.parse(s) : DEFAULT_DEBTS;
}

function saveDebts(data) {
    localStorage.setItem('bonch_debts_v4', JSON.stringify(data));
}

function getHWs() {
    const s = localStorage.getItem('bonch_hw_v4');
    return s ? JSON.parse(s) : [];
}

function saveHWs(data) {
    localStorage.setItem('bonch_hw_v4', JSON.stringify(data));
}

// ==================== NAVIGATION ====================
function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const targetPage = document.getElementById('page-' + tab);
    if (targetPage) targetPage.classList.add('active');

    document.querySelectorAll('.nav-tab-btn').forEach(b => b.classList.remove('active'));
    const activeBtn = document.querySelector(`[data-tab="${tab}"]`);
    if (activeBtn) activeBtn.classList.add('active');

    // Hide calendar strip and summary when not in schedule
    const stripWrap = document.getElementById('calendar-strip-wrap');
    const summaryBar = document.getElementById('summary-bar');
    const fabToday = document.getElementById('fab-today');

    if (tab === 'schedule') {
        stripWrap.style.display = 'flex';
        summaryBar.style.display = 'flex';
        fabToday.style.display = 'flex';
        renderScheduleTimeline();
    } else {
        stripWrap.style.display = 'none';
        summaryBar.style.display = 'none';
        fabToday.style.display = 'none';
        if (tab === 'session') renderSession();
        else if (tab === 'homework') renderHomework();
        else if (tab === 'retakes') renderRetakes();
    }
}

// ==================== CALENDAR STRIP & DATES ====================
function getMonday(d) {
    d = new Date(d);
    const day = d.getDay();
    const diff = d.getDate() - day + (day === 0 ? -6 : 1);
    return new Date(d.setDate(diff));
}

function renderCalendarStrip() {
    const now = new Date();
    const baseDate = new Date();
    baseDate.setDate(now.getDate() + (weekOffset * 7));
    const monday = getMonday(baseDate);

    // Update Header Date Range (e.g. 23 ноября – 28 ноября)
    const saturday = new Date(monday);
    saturday.setDate(monday.getDate() + 5);
    document.getElementById('header-date-range').textContent = 
        `${monday.getDate()} ${MONTHS_NAMES[monday.getMonth()]} – ${saturday.getDate()} ${MONTHS_NAMES[saturday.getMonth()]}`;

    let html = '';
    for (let i = 0; i < 6; i++) {
        const dayDate = new Date(monday);
        dayDate.setDate(monday.getDate() + i);
        const dow = i + 1; // 1=Mon..6=Sat
        const isActive = (dow === selectedDow);

        // Calculate lesson stripes for this day
        const lessons = SCHEDULE_DATA[currentWeekType][dow] || [];
        let stripesHtml = '';
        if (lessons.length > 0) {
            stripesHtml = lessons.map(l => {
                let colorClass = 'blue';
                if (l.type === 'pe') colorClass = 'green';
                else if (l.type === 'lab') colorClass = 'yellow';
                else if (l.type === 'practice') colorClass = 'orange';
                return `<div class="dp-stripe ${colorClass}"></div>`;
            }).slice(0, 4).join('');
        }

        const dateStr = `${dayDate.getDate()}.${String(dayDate.getMonth()+1).padStart(2,'0')}`;

        html += `
            <div class="day-pill ${isActive ? 'active' : ''}" onclick="selectDay(${dow})">
                <span class="dp-dow">${DAYS_SHORT[dow]}</span>
                <span class="dp-date">${dateStr}</span>
                <div class="dp-stripes">${stripesHtml}</div>
            </div>
        `;
    }

    document.getElementById('calendar-strip').innerHTML = html;
}

function selectDay(dow) {
    selectedDow = dow;
    renderCalendarStrip();
    renderScheduleTimeline();
}

function navDay(direction) {
    selectedDow += direction;
    if (selectedDow > 6) {
        selectedDow = 1;
        weekOffset += 1;
        currentWeekType = currentWeekType === 1 ? 2 : 1;
    } else if (selectedDow < 1) {
        selectedDow = 6;
        weekOffset -= 1;
        currentWeekType = currentWeekType === 1 ? 2 : 1;
    }
    updateWeekToggleButton();
    renderCalendarStrip();
    renderScheduleTimeline();
}

function toggleWeekType(btn) {
    currentWeekType = currentWeekType === 1 ? 2 : 1;
    updateWeekToggleButton();
    renderCalendarStrip();
    renderScheduleTimeline();
}

function updateWeekToggleButton() {
    const btn = document.getElementById('btn-week-toggle');
    btn.textContent = currentWeekType === 1 ? 'Нечётная' : 'Чётная';
}

function goToToday() {
    const now = new Date();
    weekOffset = 0;
    selectedDow = now.getDay() === 0 ? 1 : now.getDay();
    currentWeekType = getAutoWeekType();
    updateWeekToggleButton();
    renderCalendarStrip();
    renderScheduleTimeline();
}

function setViewMode(mode, btn) {
    document.querySelectorAll('.segmented-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (mode === 'list') {
        renderAllWeekList();
    } else {
        renderScheduleTimeline();
    }
}

// ==================== TIMELINE RENDERING ====================
function renderScheduleTimeline() {
    const lessons = (SCHEDULE_DATA[currentWeekType] && SCHEDULE_DATA[currentWeekType][selectedDow]) || [];

    // Summary calculation (Лекций X · Практик Y)
    let lecs = 0, practices = 0, labs = 0;
    lessons.forEach(l => {
        if (l.type === 'lecture') lecs++;
        else if (l.type === 'practice' || l.type === 'pe') practices++;
        else if (l.type === 'lab') labs++;
    });

    const summaryParts = [];
    if (lecs > 0) summaryParts.push(`Лекций ${lecs}`);
    if (practices > 0) summaryParts.push(`Практик ${practices}`);
    if (labs > 0) summaryParts.push(`Лабораторных ${labs}`);

    document.getElementById('summary-text').textContent = 
        summaryParts.length > 0 ? summaryParts.join(' · ') : (selectedDow === 5 ? 'День самостоятельной работы' : 'Занятий нет');

    if (lessons.length === 0) {
        const msg = selectedDow === 5 ? '📖 День самостоятельной работы' : '🎉 В этот день пар нет!';
        document.getElementById('timeline-list').innerHTML = `
            <div class="empty-box">
                <div class="icon">😴</div>
                <div style="font-size: 15px; font-weight: 600;">${msg}</div>
            </div>
        `;
        return;
    }

    let html = '';
    lessons.forEach((l, index) => {
        let badgeColor = 'blue';
        let pillColor = 'blue';
        let isPE = false;

        if (l.type === 'pe') {
            badgeColor = 'green';
            pillColor = 'green';
            isPE = true;
        } else if (l.type === 'lab') {
            badgeColor = 'yellow';
            pillColor = 'yellow';
        } else if (l.type === 'practice') {
            badgeColor = 'orange';
            pillColor = 'orange';
        }

        html += `
            <div class="timeline-row">
                <div class="timeline-indicator">
                    <div class="time-badge ${badgeColor}">${l.num}</div>
                    <div class="time-start">${l.timeStart}</div>
                    <div class="time-line ${badgeColor}"></div>
                    <div class="time-end">${l.timeEnd}</div>
                </div>
                <div class="lesson-card-bonch ${isPE ? 'pe' : ''}">
                    <div class="card-top-row">
                        <span class="type-pill ${pillColor}">${l.typeLabel}</span>
                        <span class="card-counter">${l.counter || ''}</span>
                    </div>
                    <div class="card-title">${l.name}</div>
                    <div class="card-info-row">
                        <div class="card-info-item">
                            <span>👤</span>
                            <span>${l.teacher}</span>
                        </div>
                        <span class="card-arrow">❯</span>
                    </div>
                    <div class="card-info-row">
                        <div class="card-info-item">
                            <span>📍</span>
                            <span>${l.room}</span>
                        </div>
                        <span class="card-arrow">❯</span>
                    </div>
                </div>
            </div>
        `;
    });

    document.getElementById('timeline-list').innerHTML = html;
}

function renderAllWeekList() {
    let html = '';
    for (let dow = 1; dow <= 6; dow++) {
        const lessons = (SCHEDULE_DATA[currentWeekType] && SCHEDULE_DATA[currentWeekType][dow]) || [];
        html += `<div style="font-size: 15px; font-weight: 800; color: var(--orange); margin: 16px 0 8px;">${DAYS_NAMES[dow]}</div>`;
        if (lessons.length === 0) {
            html += `<div style="color: var(--text-muted); font-size: 13px; margin-bottom: 12px;">Пар нет</div>`;
        } else {
            lessons.forEach(l => {
                html += `
                    <div class="lesson-card-bonch" style="margin-bottom: 8px;">
                        <div class="card-top-row">
                            <span class="type-pill blue">${l.typeLabel} · ${l.timeStart}–${l.timeEnd}</span>
                            <span class="card-counter">Ауд. ${l.room}</span>
                        </div>
                        <div class="card-title" style="font-size: 14px;">${l.name}</div>
                        <div style="font-size: 12px; color: var(--text-muted);">👤 ${l.teacher}</div>
                    </div>
                `;
            });
        }
    }
    document.getElementById('timeline-list').innerHTML = html;
}

function renderSession() {
    const debts = getDebts();
    const now = new Date();
    now.setHours(0,0,0,0);

    let html = '';
    debts.forEach(d => {
        const rd = new Date(d.date);
        rd.setHours(0,0,0,0);
        const diff = Math.ceil((rd - now) / 864e5);

        let statusText = '';
        let tagClass = 'soon';
        if (d.passed) {
            statusText = '✅ Сдано';
            tagClass = 'done';
        } else if (diff < 0) {
            statusText = 'Прошла';
            tagClass = 'soon';
        } else if (diff === 0) {
            statusText = '🚨 СЕГОДНЯ!';
            tagClass = 'urgent';
        } else if (diff === 1) {
            statusText = '⚠️ ЗАВТРА!';
            tagClass = 'urgent';
        } else {
            statusText = `через ${diff} дн.`;
            tagClass = 'soon';
        }

        html += `
            <div class="debt-item-bonch ${d.passed ? 'passed' : ''}">
                <div class="debt-top">
                    <div class="debt-name">${d.subject}</div>
                    <span class="debt-status-tag ${tagClass}">${statusText}</span>
                </div>
                <div class="debt-meta">
                    <div class="debt-meta-row">🏛 ${d.dept || 'СПбГУТ'}</div>
                    <div class="debt-meta-row">📆 Ближайшая: <b style="color:#FFF; margin-left:4px;">${formatDateStr(d.date)} (${d.time})</b></div>
                    <div class="debt-meta-row">📍 ${d.room}</div>
                </div>
                ${d.datesList ? `
                    <div class="dates-box">
                        <div style="font-weight:700; color:var(--text-secondary); margin-bottom:4px;">📋 Все даты комиссий:</div>
                        ${d.datesList.map(dt => `<div>• ${dt}</div>`).join('')}
                        ${d.pdf ? `<div><a href="${d.pdf}" target="_blank" class="pdf-link">📄 Скачать расписание PDF ↗</a></div>` : ''}
                    </div>
                ` : ''}
                <div class="debt-actions-row">
                    <button class="btn-bonch ${d.passed ? 'outline' : 'success'}" onclick="toggleDebtPass('${d.id}')">
                        ${d.passed ? '↩️ Отменить сдачу' : '✅ Отметить как сданное'}
                    </button>
                </div>
            </div>
        `;
    });

    document.getElementById('debts-container').innerHTML = html;
}

function toggleDebtPass(id) {
    const debts = getDebts();
    const d = debts.find(x => x.id === id);
    if (d) {
        d.passed = !d.passed;
        saveDebts(debts);
        renderSession();
    }
}

function formatDateStr(ds) {
    if (!ds) return '';
    const d = new Date(ds);
    return `${d.getDate()} ${MONTHS_NAMES[d.getMonth()]}`;
}

// ==================== RETAKES TAB ====================
function renderRetakes() {
    const debts = getDebts();
    let retakes = [];
    debts.forEach(d => {
        if (!d.passed && d.datesList) {
            d.datesList.forEach(dt => {
                if (!dt.includes('✅')) {
                    retakes.push({ subject: d.subject, text: dt, pdf: d.pdf });
                }
            });
        }
    });

    let html = retakes.map(r => `
        <div class="lesson-card-bonch" style="margin-bottom: 10px;">
            <div class="card-top-row">
                <span class="type-pill orange">Комиссия</span>
                ${r.pdf ? `<a href="${r.pdf}" target="_blank" style="font-size:11px; color:var(--orange); text-decoration:none; font-weight:700;">PDF ↗</a>` : ''}
            </div>
            <div class="card-title">${r.subject}</div>
            <div style="font-size: 13px; color: #FFFFFF; font-weight: 600; margin-top: 4px;">📅 ${r.text}</div>
        </div>
    `).join('');

    document.getElementById('retakes-container').innerHTML = html || '<div class="empty-box"><div class="icon">🎓</div><div>Все долги закрыты!</div></div>';
}

// ==================== HOMEWORK ====================
function renderHomework() {
    const hws = getHWs();
    if (hws.length === 0) {
        document.getElementById('hw-container').innerHTML = `
            <div class="empty-box">
                <div class="icon">📝</div>
                <div>Заданий пока нет</div>
            </div>
        `;
        return;
    }

    let html = hws.map(h => `
        <div class="lesson-card-bonch" style="margin-bottom: 10px;">
            <div class="card-top-row">
                <span class="type-pill blue">${h.subject}</span>
                <span style="font-size: 11px; color: var(--orange); font-weight: 700;">Дедлайн: ${h.deadline}</span>
            </div>
            <div style="font-size: 14px; color: #FFFFFF; margin: 6px 0;">${h.text}</div>
            <button class="btn-bonch outline" style="padding: 4px 10px; font-size: 11px;" onclick="deleteHW('${h.id}')">Удалить</button>
        </div>
    `).join('');

    document.getElementById('hw-container').innerHTML = html;
}

function openAddHWModal() {
    document.getElementById('modal-content').innerHTML = `
        <div class="modal-title">📝 Новое задание</div>
        <div class="form-group">
            <label class="form-label">Предмет</label>
            <input class="form-input" id="new-hw-subj" placeholder="Например: Технологии программирования">
        </div>
        <div class="form-group">
            <label class="form-label">Описание</label>
            <textarea class="form-textarea" id="new-hw-text" rows="3" placeholder="Что нужно сделать..."></textarea>
        </div>
        <div class="form-group">
            <label class="form-label">Дедлайн</label>
            <input class="form-input" type="date" id="new-hw-date">
        </div>
        <button class="form-btn-submit" onclick="submitHW()">Добавить</button>
    `;
    showModal();
}

function submitHW() {
    const subj = document.getElementById('new-hw-subj').value.trim();
    const text = document.getElementById('new-hw-text').value.trim();
    const date = document.getElementById('new-hw-date').value;
    if (!subj || !text) { alert('Заполните предмет и текст'); return; }

    const hws = getHWs();
    hws.push({ id: Date.now().toString(), subject: subj, text, deadline: date });
    saveHWs(hws);
    closeModalForce();
    renderHomework();
}

function deleteHW(id) {
    saveHWs(getHWs().filter(h => h.id !== id));
    renderHomework();
}

// ==================== CACHE RESET ====================
function resetCache() {
    if (confirm('Сбросить сохранённые данные и загрузить свежее расписание Bonch Go?')) {
        localStorage.clear();
        location.reload(true);
    }
}

// ==================== MODAL UTILS ====================
function showModal() {
    document.getElementById('modal-overlay').classList.add('show');
    document.body.style.overflow = 'hidden';
}

function closeModal(e) {
    if (e.target === document.getElementById('modal-overlay')) closeModalForce();
}

function closeModalForce() {
    document.getElementById('modal-overlay').classList.remove('show');
    document.body.style.overflow = '';
}

// ==================== TELEGRAM WEBAPP ====================
try {
    if (window.Telegram && Telegram.WebApp) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
        Telegram.WebApp.setHeaderColor('#0B0D11');
        Telegram.WebApp.setBackgroundColor('#0B0D11');
    }
} catch(e) {}

// ==================== INITIALIZATION ====================
updateWeekToggleButton();
renderCalendarStrip();
renderScheduleTimeline();
</script>
