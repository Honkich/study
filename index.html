<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Учёба — ИКТО 2542</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #4A6CF7;
            --primary-light: #6B8AFF;
            --primary-dark: #3451DB;
            --accent: #1DB9AA;
            --accent-light: #2DD4C3;
            --bg: #F0F2F5;
            --card: #FFFFFF;
            --text: #1A1A2E;
            --text-secondary: #6B7280;
            --text-light: #9CA3AF;
            --danger: #EF4444;
            --warning: #F59E0B;
            --success: #10B981;
            --border: #E5E7EB;
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-lg: 0 4px 16px rgba(0,0,0,0.1);
            --radius: 14px;
            --radius-sm: 10px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            padding-bottom: calc(70px + var(--safe-bottom));
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: var(--card);
            padding: 16px 20px 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .header-title {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 2px;
        }

        .header-group {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
        }

        /* Page containers */
        .page {
            display: none;
            padding: 16px;
            animation: fadeIn 0.25s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Section titles */
        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title .icon {
            font-size: 20px;
        }

        /* Cards */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            transition: transform 0.15s ease;
        }

        .card:active {
            transform: scale(0.98);
        }

        /* Home page - overview cards */
        .overview-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin: 0 -16px;
            padding-left: 16px;
            padding-right: 16px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .overview-scroll::-webkit-scrollbar {
            display: none;
        }

        .overview-card {
            min-width: 160px;
            border-radius: var(--radius);
            padding: 16px;
            color: white;
            scroll-snap-align: start;
            flex-shrink: 0;
        }

        .overview-card.schedule {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
        }

        .overview-card.homework {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
        }

        .overview-card.retake {
            background: linear-gradient(135deg, #F59E0B, #FBBF24);
        }

        .overview-card .ov-number {
            font-size: 32px;
            font-weight: 800;
            line-height: 1;
        }

        .overview-card .ov-label {
            font-size: 13px;
            opacity: 0.9;
            margin-top: 4px;
        }

        /* Schedule */
        .day-selector {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .day-selector::-webkit-scrollbar {
            display: none;
        }

        .day-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            border: none;
            background: var(--card);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            min-width: 52px;
            box-shadow: var(--shadow);
            transition: all 0.2s ease;
        }

        .day-btn .day-num {
            font-size: 16px;
            font-weight: 700;
            margin-top: 2px;
            color: var(--text);
        }

        .day-btn.active {
            background: var(--primary);
            color: white;
        }

        .day-btn.active .day-num {
            color: white;
        }

        .day-btn.today {
            border: 2px solid var(--primary);
        }

        .schedule-date-label {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 12px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .schedule-date-label .cal-icon {
            font-size: 18px;
        }

        /* Lesson card */
        .lesson-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 14px 16px;
            margin-bottom: 10px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            border-left: 4px solid transparent;
        }

        .lesson-card.lecture {
            border-left-color: var(--primary);
        }

        .lesson-card.seminar {
            border-left-color: var(--accent);
        }

        .lesson-card.lab {
            border-left-color: var(--warning);
        }

        .lesson-card.practice {
            border-left-color: var(--success);
        }

        .lesson-num {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .lesson-card.lecture .lesson-num {
            background: var(--primary);
        }

        .lesson-card.seminar .lesson-num {
            background: var(--accent);
        }

        .lesson-card.lab .lesson-num {
            background: var(--warning);
        }

        .lesson-card.practice .lesson-num {
            background: var(--success);
        }

        .lesson-info {
            flex: 1;
            min-width: 0;
        }

        .lesson-type-time {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .lesson-type {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .lesson-card.lecture .lesson-type { color: var(--primary); }
        .lesson-card.seminar .lesson-type { color: var(--accent); }
        .lesson-card.lab .lesson-type { color: var(--warning); }
        .lesson-card.practice .lesson-type { color: var(--success); }

        .lesson-time {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .lesson-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .lesson-room {
            font-size: 13px;
            color: var(--text-light);
        }

        /* Homework */
        .hw-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 14px 16px;
            margin-bottom: 10px;
            box-shadow: var(--shadow);
            position: relative;
        }

        .hw-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .hw-subject {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
        }

        .hw-deadline {
            font-size: 12px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            white-space: nowrap;
        }

        .hw-deadline.soon {
            background: #FEF3C7;
            color: #D97706;
        }

        .hw-deadline.overdue {
            background: #FEE2E2;
            color: #DC2626;
        }

        .hw-deadline.ok {
            background: #D1FAE5;
            color: #059669;
        }

        .hw-text {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.4;
            margin-bottom: 8px;
        }

        .hw-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hw-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-light);
        }

        .hw-check {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: 2px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            background: white;
        }

        .hw-check.done {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        .hw-delete {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            transition: all 0.15s;
        }

        .hw-delete:hover {
            color: var(--danger);
            background: #FEE2E2;
        }

        /* Retake cards */
        .retake-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 14px 16px;
            margin-bottom: 10px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--danger);
        }

        .retake-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .retake-subject {
            font-size: 15px;
            font-weight: 700;
        }

        .retake-date {
            font-size: 13px;
            font-weight: 600;
            color: var(--danger);
        }

        .retake-info {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .retake-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .retake-days-left {
            font-size: 12px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            background: #FEE2E2;
            color: #DC2626;
        }

        .retake-delete {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }

        .empty-state .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .empty-state .empty-text {
            font-size: 15px;
            font-weight: 500;
        }

        /* FAB (floating action button) */
        .fab {
            position: fixed;
            bottom: calc(80px + var(--safe-bottom));
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--primary);
            color: white;
            border: none;
            font-size: 28px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 90;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .fab:active {
            transform: scale(0.9);
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            padding-bottom: calc(8px + var(--safe-bottom));
            border-top: 1px solid var(--border);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 4px 12px;
            border: none;
            background: none;
            color: var(--text-light);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 10px;
            transition: color 0.2s ease;
        }

        .nav-item .nav-icon {
            font-size: 22px;
            transition: transform 0.2s ease;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item.active .nav-icon {
            transform: scale(1.1);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 200;
            display: none;
            align-items: flex-end;
            justify-content: center;
            animation: fadeInBg 0.2s ease;
        }

        .modal-overlay.show {
            display: flex;
        }

        @keyframes fadeInBg {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: var(--card);
            border-radius: 20px 20px 0 0;
            padding: 24px 20px;
            padding-bottom: calc(24px + var(--safe-bottom));
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-handle {
            width: 36px;
            height: 4px;
            border-radius: 2px;
            background: var(--border);
            margin: 0 auto 16px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            display: block;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-family: inherit;
            color: var(--text);
            background: var(--bg);
            transition: border-color 0.2s ease;
            outline: none;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            border-color: var(--primary);
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--primary);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            font-family: inherit;
        }

        .form-btn:active {
            transform: scale(0.98);
            background: var(--primary-dark);
        }

        /* Filter tabs */
        .filter-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .filter-tabs::-webkit-scrollbar { display: none; }

        .filter-tab {
            padding: 7px 14px;
            border-radius: 20px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            background: var(--card);
            color: var(--text-secondary);
            box-shadow: var(--shadow);
            transition: all 0.2s ease;
        }

        .filter-tab.active {
            background: var(--primary);
            color: white;
        }

        /* No classes */
        .no-classes {
            text-align: center;
            padding: 40px 20px;
        }

        .no-classes .emoji {
            font-size: 48px;
            margin-bottom: 8px;
        }

        .no-classes .text {
            color: var(--text-light);
            font-size: 15px;
            font-weight: 500;
        }

        /* Week type toggle */
        .week-toggle {
            display: flex;
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 3px;
            margin-bottom: 14px;
        }

        .week-toggle-btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            background: transparent;
            color: var(--text-secondary);
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .week-toggle-btn.active {
            background: var(--card);
            color: var(--text);
            box-shadow: var(--shadow);
        }

        /* Schedule edit buttons */
        .schedule-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .schedule-action-btn {
            padding: 8px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--card);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
        }

        .schedule-action-btn:active {
            background: var(--bg);
        }

        .hw-done-card {
            opacity: 0.5;
        }

        .hw-done-card .hw-subject {
            text-decoration: line-through;
        }
    </style>
</head>
<body>

<!-- Header -->
<div class="header">
    <div class="header-title">СПбГУТ</div>
    <div class="header-group">ИКТО 2542</div>
</div>

<!-- ===== PAGE: HOME ===== -->
<div class="page active" id="page-home">
    <div style="margin-bottom: 20px;">
        <div class="section-title"><span class="icon">👋</span> <span id="greeting">Привет!</span></div>
        <div style="color: var(--text-secondary); font-size: 14px;" id="today-label"></div>
    </div>

    <div class="overview-scroll" style="margin-bottom: 20px;">
        <div class="overview-card schedule" onclick="switchTab('schedule')">
            <div class="ov-number" id="home-lessons-count">0</div>
            <div class="ov-label">Пар сегодня</div>
        </div>
        <div class="overview-card homework" onclick="switchTab('homework')">
            <div class="ov-number" id="home-hw-count">0</div>
            <div class="ov-label">Активных ДЗ</div>
        </div>
        <div class="overview-card retake" onclick="switchTab('retakes')">
            <div class="ov-number" id="home-retake-count">0</div>
            <div class="ov-label">Пересдач</div>
        </div>
    </div>

    <div class="section-title"><span class="icon">📅</span> Пары сегодня</div>
    <div id="home-today-lessons"></div>

    <div style="margin-top: 20px;">
        <div class="section-title"><span class="icon">📝</span> Ближайшие ДЗ</div>
        <div id="home-upcoming-hw"></div>
    </div>

    <div style="margin-top: 20px;">
        <div class="section-title"><span class="icon">🔄</span> Ближайшие пересдачи</div>
        <div id="home-upcoming-retakes"></div>
    </div>
</div>

<!-- ===== PAGE: SCHEDULE ===== -->
<div class="page" id="page-schedule">
    <div class="section-title"><span class="icon">📅</span> Расписание</div>

    <div class="week-toggle">
        <button class="week-toggle-btn active" onclick="setWeekType(1)" id="week-btn-1">Нечётная неделя</button>
        <button class="week-toggle-btn" onclick="setWeekType(2)" id="week-btn-2">Чётная неделя</button>
    </div>

    <div class="day-selector" id="day-selector"></div>

    <div class="schedule-date-label" id="schedule-date-label"></div>

    <div id="schedule-lessons"></div>

    <div class="schedule-actions">
        <button class="schedule-action-btn" onclick="openEditScheduleModal()">✏️ Редактировать</button>
    </div>
</div>

<!-- ===== PAGE: HOMEWORK ===== -->
<div class="page" id="page-homework">
    <div class="section-title"><span class="icon">📝</span> Домашние задания</div>

    <div class="filter-tabs">
        <button class="filter-tab active" onclick="filterHW('all')">Все</button>
        <button class="filter-tab" onclick="filterHW('active')">Активные</button>
        <button class="filter-tab" onclick="filterHW('done')">Выполненные</button>
        <button class="filter-tab" onclick="filterHW('overdue')">Просроченные</button>
    </div>

    <div id="hw-list"></div>
</div>

<!-- ===== PAGE: RETAKES ===== -->
<div class="page" id="page-retakes">
    <div class="section-title"><span class="icon">🔄</span> Пересдачи</div>
    <div id="retakes-list"></div>
</div>

<!-- FAB -->
<button class="fab" id="fab-btn" onclick="openAddModal()">+</button>

<!-- Bottom Navigation -->
<div class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('home')" data-tab="home">
        <span class="nav-icon">🏠</span>
        <span>Главная</span>
    </button>
    <button class="nav-item" onclick="switchTab('schedule')" data-tab="schedule">
        <span class="nav-icon">📅</span>
        <span>Расписание</span>
    </button>
    <button class="nav-item" onclick="switchTab('homework')" data-tab="homework">
        <span class="nav-icon">📝</span>
        <span>ДЗ</span>
    </button>
    <button class="nav-item" onclick="switchTab('retakes')" data-tab="retakes">
        <span class="nav-icon">🔄</span>
        <span>Пересдачи</span>
    </button>
</div>

<!-- Modal: Add -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <div id="modal-content"></div>
    </div>
</div>

<script>
// ========== DATA ==========
const DAYS = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const DAYS_SHORT = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

// Default schedule for ИКТО 2542 (sample, user can edit)
const DEFAULT_SCHEDULE = {

if (selectedDay === 0) selectedDay = 1;

function getSchedule() {

}

}

}

// ========== NAVIGATION ==========
function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + tab).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelector(`[data-tab="${tab}"]`).classList.add('active');

    // Show/hide FAB
    const fab = document.getElementById('fab-btn');
    fab.style.display = (tab === 'homework' || tab === 'retakes') ? 'flex' : 'none';

    renderCurrentPage();
}

function renderCurrentPage() {
    switch (currentTab) {
        case 'home': renderHome(); break;
        case 'schedule': renderSchedule(); break;
        case 'homework': renderHomework(); break;
        case 'retakes': renderRetakes(); break;
    }
}

// ========== HOME ==========
function renderHome() {
    const now = new Date();
    const hour = now.getHours();
    let greet = 'Доброй ночи! 🌙';
    if (hour >= 5 && hour < 12) greet = 'Доброе утро! ☀️';
    else if (hour >= 12 && hour < 17) greet = 'Добрый день! 🌤';
    else if (hour >= 17 && hour < 23) greet = 'Добрый вечер! 🌆';
    document.getElementById('greeting').textContent = greet;

    const dayName = DAYS[now.getDay()];
    const dateStr = `${dayName}, ${now.getDate()} ${MONTHS[now.getMonth()]}`;
    document.getElementById('today-label').textContent = dateStr;

    // Today's lessons
    const schedule = getSchedule();
    const todayDow = now.getDay();
    const weekType = getAutoWeekType();
    const todayLessons = (todayDow >= 1 && todayDow <= 6) ?
        (schedule[weekType] && schedule[weekType][todayDow] ? schedule[weekType][todayDow] : []) : [];

    document.getElementById('home-lessons-count').textContent = todayLessons.length;

    const lessonsHtml = todayLessons.length > 0 ?
        todayLessons.map(l => renderLessonCard(l)).join('') :
        '<div class="no-classes"><div class="emoji">🎉</div><div class="text">Сегодня пар нет!</div></div>';
    document.getElementById('home-today-lessons').innerHTML = lessonsHtml;

    // Upcoming HW
    const hws = getHomeworks().filter(h => !h.done).sort((a,b) => new Date(a.deadline) - new Date(b.deadline)).slice(0, 3);
    document.getElementById('home-hw-count').textContent = getHomeworks().filter(h => !h.done).length;
    document.getElementById('home-upcoming-hw').innerHTML = hws.length > 0 ?
        hws.map(h => renderHWCard(h)).join('') :
        '<div class="empty-state"><div class="empty-icon">✅</div><div class="empty-text">Нет активных ДЗ</div></div>';

    // Upcoming retakes
    const retakes = getRetakes().sort((a,b) => new Date(a.date) - new Date(b.date)).slice(0, 3);
    document.getElementById('home-retake-count').textContent = retakes.length;
    document.getElementById('home-upcoming-retakes').innerHTML = retakes.length > 0 ?
        retakes.map(r => renderRetakeCard(r)).join('') :
        '<div class="empty-state"><div class="empty-icon">🎓</div><div class="empty-text">Пересдач нет</div></div>';
}

function getAutoWeekType() {
    // Simple: use ISO week number to determine odd/even
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 1);
    const diff = (now - start + ((start.getTimezoneOffset() - now.getTimezoneOffset()) * 60000)) / 86400000;
    const weekNum = Math.ceil((diff + start.getDay() + 1) / 7);
    return (weekNum % 2 === 1) ? 1 : 2;
}

// ========== SCHEDULE ==========
function setWeekType(type) {
    currentWeekType = type;
    document.getElementById('week-btn-1').classList.toggle('active', type === 1);
    document.getElementById('week-btn-2').classList.toggle('active', type === 2);
    renderSchedule();
}

function renderSchedule() {
    const now = new Date();
    const todayDow = now.getDay();

    // Day selector (Mon-Sat)
    let selectorHtml = '';
    const weekStart = new Date(now);
    weekStart.setDate(now.getDate() - (now.getDay() === 0 ? 6 : now.getDay() - 1));

    for (let i = 0; i < 6; i++) {
        const d = new Date(weekStart);
        d.setDate(weekStart.getDate() + i);
        const dow = d.getDay(); // 1-6
        const isActive = (i + 1) === selectedDay;
        const isToday = d.toDateString() === now.toDateString();
        selectorHtml += `<button class="day-btn ${isActive ? 'active' : ''} ${isToday ? 'today' : ''}" onclick="selectDay(${i+1})">
            <span>${DAYS_SHORT[dow]}</span>
            <span class="day-num">${d.getDate()}</span>
        </button>`;
    }
    document.getElementById('day-selector').innerHTML = selectorHtml;

    // Date label
    const selDate = new Date(weekStart);
    selDate.setDate(weekStart.getDate() + selectedDay - 1);
    const dateLabel = `${DAYS[selDate.getDay()]}, ${selDate.getDate()} ${MONTHS[selDate.getMonth()]}`;
    document.getElementById('schedule-date-label').innerHTML = `<span class="cal-icon">📆</span> ${dateLabel}`;

    // Lessons
    const schedule = getSchedule();
    const lessons = schedule[currentWeekType] && schedule[currentWeekType][selectedDay]
        ? schedule[currentWeekType][selectedDay] : [];

    document.getElementById('schedule-lessons').innerHTML = lessons.length > 0 ?
        lessons.map(l => renderLessonCard(l)).join('') :
        '<div class="no-classes"><div class="emoji">😴</div><div class="text">В этот день пар нет</div></div>';
}

function selectDay(day) {
    selectedDay = day;
    renderSchedule();
}

function renderLessonCard(lesson) {
    const typeLabels = { lecture: 'Лекция', seminar: 'Семинар', lab: 'Лабораторная', practice: 'Практика' };
    return `<div class="lesson-card ${lesson.type}">
        <div class="lesson-num">${lesson.num}</div>
        <div class="lesson-info">
            <div class="lesson-type-time">
                <span class="lesson-type">${typeLabels[lesson.type] || lesson.type}</span>
                <span class="lesson-time">${lesson.time}</span>
            </div>
            <div class="lesson-name">${lesson.name}</div>
            <div class="lesson-room">${lesson.room}</div>
        </div>
    </div>`;
}

// ========== HOMEWORK ==========
function filterHW(filter) {
    hwFilter = filter;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    renderHomework();
}

function renderHomework() {
    let hws = getHomeworks();
    const now = new Date();
    now.setHours(0,0,0,0);

    if (hwFilter === 'active') hws = hws.filter(h => !h.done);
    else if (hwFilter === 'done') hws = hws.filter(h => h.done);
    else if (hwFilter === 'overdue') hws = hws.filter(h => !h.done && new Date(h.deadline) < now);

    hws.sort((a,b) => new Date(a.deadline) - new Date(b.deadline));

    document.getElementById('hw-list').innerHTML = hws.length > 0 ?
        hws.map(h => renderHWCard(h)).join('') :
        '<div class="empty-state"><div class="empty-icon">📚</div><div class="empty-text">Нет заданий</div></div>';
}

function renderHWCard(hw) {
    const now = new Date();
    now.setHours(0,0,0,0);
    const deadline = new Date(hw.deadline);
    deadline.setHours(0,0,0,0);
    const diff = Math.ceil((deadline - now) / 86400000);

    let deadlineClass = 'ok';
    let deadlineText = '';
    if (hw.done) {
        deadlineClass = 'ok';
        deadlineText = '✅ Выполнено';
    } else if (diff < 0) {
        deadlineClass = 'overdue';
        deadlineText = `Просрочено ${Math.abs(diff)} дн.`;
    } else if (diff === 0) {
        deadlineClass = 'overdue';
        deadlineText = 'Сегодня!';
    } else if (diff <= 3) {
        deadlineClass = 'soon';
        deadlineText = `Через ${diff} дн.`;
    } else {
        deadlineText = `${deadline.getDate()} ${MONTHS[deadline.getMonth()]}`;
    }

    return `<div class="hw-card ${hw.done ? 'hw-done-card' : ''}">
        <div class="hw-header">
            <div class="hw-subject">${hw.subject}</div>
            <div class="hw-deadline ${deadlineClass}">${deadlineText}</div>
        </div>
        <div class="hw-text">${hw.text}</div>
        <div class="hw-footer">
            <div class="hw-status" onclick="toggleHW('${hw.id}')">
                <div class="hw-check ${hw.done ? 'done' : ''}">${hw.done ? '✓' : ''}</div>
                <span>${hw.done ? 'Выполнено' : 'Отметить'}</span>
            </div>
            <button class="hw-delete" onclick="deleteHW('${hw.id}')">🗑</button>
        </div>
    </div>`;
}

function toggleHW(id) {
    const hws = getHomeworks();
    const hw = hws.find(h => h.id === id);
    if (hw) {
        hw.done = !hw.done;
        saveHomeworks(hws);
        renderCurrentPage();
    }
}

function deleteHW(id) {
    if (!confirm('Удалить задание?')) return;
    const hws = getHomeworks().filter(h => h.id !== id);
    saveHomeworks(hws);
    renderCurrentPage();
}

function renderRetakeCard(retake) {
    const now = new Date();

    const date = new Date(retake.date);
    date.setHours(0,0,0,0);
    const diff = Math.ceil((date - now) / 86400000);

    let daysText = '';
    if (diff < 0) daysText = 'Прошла';
    else if (diff === 0) daysText = 'Сегодня!';
    else daysText = `Через ${diff} дн.`;

    return `<div class="retake-card">
        <div class="retake-header">
            <div class="retake-subject">${retake.subject}</div>
            <div class="retake-date">${date.getDate()} ${MONTHS[date.getMonth()]}</div>

            <button class="retake-delete" onclick="deleteRetake('${retake.id}')">🗑</button>

}

function addLesson() {
    const name = document.getElementById('les-name').value.trim();
    const num = parseInt(document.getElementById('les-num').value);
    const type = document.getElementById('les-type').value;
    const time = document.getElementById('les-time').value.trim();
    const room = document.getElementById('les-room').value.trim();

    if (!name || !time) { alert('Заполните название и время'); return; }

    const schedule = getSchedule();
    if (!schedule[currentWeekType]) schedule[currentWeekType] = {};
    if (!schedule[currentWeekType][selectedDay]) schedule[currentWeekType][selectedDay] = [];

    schedule[currentWeekType][selectedDay].push({ num, type, name, time, room });
    schedule[currentWeekType][selectedDay].sort((a,b) => a.num - b.num);

    saveSchedule(schedule);
    closeModalForce();
    renderSchedule();
}

function removeLesson(index) {
    if (!confirm('Удалить эту пару?')) return;
    const schedule = getSchedule();
    schedule[currentWeekType][selectedDay].splice(index, 1);
    saveSchedule(schedule);
    closeModalForce();
    renderSchedule();
    openEditScheduleModal();
}

function addHW() {
    let subject = document.getElementById('hw-subject').value;
    if (subject === '__custom') subject = document.getElementById('hw-custom-subject').value.trim();
    const text = document.getElementById('hw-text').value.trim();
    const deadline = document.getElementById('hw-deadline').value;

    if (!subject || !text || !deadline) { alert('Заполните все поля'); return; }

    const hws = getHomeworks();
    hws.push({ id: Date.now().toString(), subject, text, deadline, done: false });
    saveHomeworks(hws);
    closeModalForce();
    renderCurrentPage();
}

function addRetake() {
    let subject = document.getElementById('retake-subject').value;
    if (subject === '__custom') subject = document.getElementById('retake-custom-subject').value.trim();
    const date = document.getElementById('retake-date').value;
    const info = document.getElementById('retake-info').value.trim();

    if (!subject || !date) { alert('Заполните предмет и дату'); return; }

    const retakes = getRetakes();
    retakes.push({ id: Date.now().toString(), subject, date, info });
    saveRetakes(retakes);
    closeModalForce();
    renderCurrentPage();
}

function getSubjectsList() {
    const schedule = getSchedule();
    const subjects = new Set();
    for (const wt of Object.values(schedule)) {
        for (const day of Object.values(wt)) {
            if (Array.isArray(day)) {
                day.forEach(l => subjects.add(l.name));
            }
        }
    }
    return [...subjects].sort();
}

// ========== MODAL UTILS ==========
function showModal() {
    document.getElementById('modal-overlay').classList.add('show');
    document.body.style.overflow = 'hidden';
}

function closeModal(e) {
    if (e.target === document.getElementById('modal-overlay')) {
        closeModalForce();
    }
}

function closeModalForce() {
    document.getElementById('modal-overlay').classList.remove('show');
    document.body.style.overflow = '';
}

// ========== TELEGRAM WEBAPP ==========
try {
    if (window.Telegram && Telegram.WebApp) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        // Apply Telegram theme
        const theme = Telegram.WebApp.themeParams;
        if (theme) {
            if (theme.bg_color) document.documentElement.style.setProperty('--bg', theme.secondary_bg_color || '#F0F2F5');
            if (theme.section_bg_color) document.documentElement.style.setProperty('--card', theme.section_bg_color || theme.bg_color);
            if (theme.text_color) document.documentElement.style.setProperty('--text', theme.text_color);
            if (theme.hint_color) document.documentElement.style.setProperty('--text-secondary', theme.hint_color);
            if (theme.button_color) {
                document.documentElement.style.setProperty('--primary', theme.button_color);
            }
        }
    }
} catch(e) {}

// ========== INIT ==========
// Auto-detect week type
currentWeekType = getAutoWeekType();
document.getElementById('week-btn-1').classList.toggle('active', currentWeekType === 1);
document.getElementById('week-btn-2').classList.toggle('active', currentWeekType === 2);

// Hide FAB initially
document.getElementById('fab-btn').style.display = 'none';

// Initial render
renderHome();
</script>
